# Local development infrastructure. Rust services run natively on the host.
#   docker compose -f deploy/compose.dev.yaml up -d
name: classroom-coders-dev

services:
  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: classcoders
      POSTGRES_PASSWORD: classcoders
      POSTGRES_DB: classcoders
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a system Postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classcoders -d classcoders"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  nats-data:
  postgres-data:
