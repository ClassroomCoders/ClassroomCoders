[workspace]
resolver = "3"
members = ["crates/common",
    "crates/game-core",
    "crates/protocol",
    "crates/sandbox",
    "crates/services/auth",
    "crates/services/game-server",
    "crates/services/realtime-gateway",
    "crates/services/scheduler",
    "crates/services/submissions",
    "web/app",
    "web/frontend",
    "web/game-views",
    "web/server",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "class-coders"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-profile-release = "wasm-release"
